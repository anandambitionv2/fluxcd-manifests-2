
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: helmacrfluxrepo
  namespace: flux-system
spec:
  interval: 1m
  url: oci://acrforhelm.azurecr.io/helm/myhelmchartnov2
  provider: azure
  ref:
    # tag: "0.2.0"
    semver: ">=0.2.0 <1.0.0" #this will autoupgrade until1.0.0 but not including 1.0.0, so it will upgrade to 0.3.0 automatically when it is released in the ACR

---
  
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: helmacrfluxrelease
  namespace: flux-system
spec:
  releaseName: helmacrfluxreleasev2
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: helmacrfluxrepo
    namespace: flux-system

  targetNamespace: default
  values: 
   replicaCount: 5



  upgrade:
    cleanupOnFail: true

