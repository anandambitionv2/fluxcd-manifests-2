apiVersion: v1
kind: Pod
metadata:
  name: tinku-pod2
  namespace: default
  labels:
    app: nginx
    environment: testing
spec:
  containers:
    - name: nginx
      image: nginx:1.28
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi
      env:
        - name: APP_ENV
          value: testing