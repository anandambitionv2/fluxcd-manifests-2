apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: anandhelmrepoflux
  namespace: flux-system
spec:
  interval: 5m
  url: https://anandambitionv2.github.io/myhelmchartnov2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anandhelmreleaseflux
  namespace: flux-system
spec:
  interval: 5m
  releaseName: anandhelmreleasev2
  chart:
    spec:
      chart: myhelmchartnov2
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: anandhelmrepoflux
        namespace: flux-system
  targetNamespace: default
 