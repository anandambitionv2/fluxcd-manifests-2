
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fullycustmanagedgitrepo
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  
  url: https://github.com/anandambitionv2/fullycustomermanaged.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fullycustmanagedkustomization
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: fullycustmanagedgitrepo
